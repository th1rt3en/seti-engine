# Builds the website on Linux (OpenNext's Cloudflare build does not work with Windows paths) and deploys it to Cloudflare.
# The owner starts it by hand: GitHub, Actions, "Deploy website", Run workflow. Needs two repository secrets (Settings, Secrets and variables,
# Actions): CLOUDFLARE_API_TOKEN (a token that may edit Workers) and CLOUDFLARE_ACCOUNT_ID. The Worker secrets stay in Cloudflare.
name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Build for Cloudflare
        working-directory: apps/web
        run: pnpm exec opennextjs-cloudflare build
      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
